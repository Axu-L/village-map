services:
  - type: web
    name: village-map
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_BASE_PATH
        value: ""
      - key: DATABASE_PATH
        value: /data/app.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: NEXT_PUBLIC_AMAP_KEY
        sync: false
      - key: NEXT_PUBLIC_AMAP_SECRET
        sync: false
    disk:
      name: village-map-data
      mountPath: /data
      sizeGB: 1
