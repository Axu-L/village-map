
#user nobody
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 100m;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 443 ssl;
        server_name  axuxtl.xyz www.axuxtl.xyz;

        ssl_certificate     /etc/ssl/cert/axuxtl.xyz.pem;
	   ssl_certificate_key /etc/ssl/cert/axuxtl.xyz.key;

	   # 配置 SSL 会话缓存，提高性能
        ssl_session_cache shared:SSL:1m;
        # 设置 SSL 会话超时时间
        ssl_session_timeout 5m;
	   ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        # ========== 原有项目 API 代理（8080） ==========
        location /api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========== 文化IP后端 API 代理（Docker 8081） ==========
        location /culture-api/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========== 财安通 API 代理 ==========
		location /ct-api/ {
		    proxy_pass http://127.0.0.1:8000/api/;
		    proxy_set_header Host $host;
		    proxy_set_header X-Real-IP $remote_addr;
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header X-Forwarded-Proto $scheme;
		    # SSE 支持（AI 对话流式响应）
		    proxy_buffering off;
		    proxy_cache off;
		    proxy_read_timeout 300s;
		    proxy_set_header Connection '';
		    proxy_http_version 1.1;
		    chunked_transfer_encoding off;
		}

        location /ws/ {
    		    proxy_pass http://127.0.0.1:8080/ws/;
		    proxy_http_version 1.1;
		    proxy_set_header Upgrade $http_upgrade;
		    proxy_set_header Connection "upgrade";
		    proxy_set_header Host $host;
		    proxy_set_header X-Real-IP $remote_addr;
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_read_timeout 86400;
	   }

	   # 3. 新增：张雪机车页面
        # 注意：这里使用 alias 映射到你存放该 HTML 文件的【文件夹】
        location /zx {
            alias /usr/local/nginx/html/zx/; # 建议新建个 zx 文件夹放这个 index.html
            index index.html;
            try_files $uri $uri/ /zx/index.html;
        }

	   # ---------- 课表推送服务配置开始 ----------
        # 课表推送服务 API 代理
		location /wecom/ {
		    proxy_pass http://127.0.0.1:5000;
		    proxy_set_header Host $host;
		    proxy_set_header X-Real-IP $remote_addr;
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header X-Forwarded-Proto $scheme;
		    proxy_buffering off;
		    proxy_cache off;
		    proxy_read_timeout 300s;
		    proxy_set_header Connection '';
		    proxy_http_version 1.1;
		    chunked_transfer_encoding off;
		}
		
		# 课表推送服务前端页面
		location /course/ {
		    alias /usr/local/nginx/html/wecom-push/;
		    index index.html;
		    try_files $uri $uri/ /course/index.html;
		}
        # ---------- 课表推送服务配置结束 ----------

		# ========== 财安通前端页面 ==========
		location /caiantong/ {
		    alias /usr/local/nginx/html/caiantong/;
		    index index.html;
		    try_files $uri $uri/ /caiantong/index.html;
		}

		# ========== 文化IP管理后台前端页面 ==========
		location /culture-ip-admin {
		    root /usr/local/nginx/html;
		    index index.html;
		    try_files $uri $uri/ /culture-ip-admin/index.html;
		}

		
		# ========== 音浪前端页面 ==========
		    # 添加 DNS 解析器（阿里云默认 DNS）
		    resolver 223.5.5.5 223.6.6.6 valid=300s;
		    resolver_timeout 10s;
		
		    location /musicweb/ {
		        alias /usr/local/nginx/html/musicweb/;
		        try_files $uri $uri/ /musicweb/index.html;
		    }
		
		    # Jamendo API 代理
		    location /api/jamendo/ {
		        proxy_pass https://api.jamendo.com/v3.0/;
		        proxy_ssl_server_name on;
		        proxy_set_header Host api.jamendo.com;
		        proxy_set_header X-Real-IP $remote_addr;
		        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		        proxy_set_header X-Forwarded-Proto $scheme;
		        proxy_connect_timeout 10s;
		        proxy_read_timeout 30s;
		    }
		
		    # NVIDIA API 代理（可选）
		    location /api/nvidia/ {
		        proxy_pass https://integrate.api.nvidia.com/;
		        proxy_ssl_server_name on;
		        proxy_set_header Host integrate.api.nvidia.com;
		        proxy_set_header X-Real-IP $remote_addr;
		        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		        proxy_set_header X-Forwarded-Proto $scheme;
		        proxy_connect_timeout 10s;
		        proxy_read_timeout 30s;
		    }

		    # ========== 3D文物归途前端页面 ==========
			location /relic {
			    alias /usr/local/nginx/html/3d-relic-repatriation;
			    index index.html;
			    try_files $uri /relic/index.html;
			}

		# ========== 科创成果转化中枢（Next.js standalone 3001） ==========
		location /chuchuangtong {
		    proxy_pass http://127.0.0.1:3001;
		    proxy_set_header Host $host;
		    proxy_set_header X-Real-IP $remote_addr;
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header X-Forwarded-Proto $scheme;
		    proxy_http_version 1.1;
		    proxy_set_header Connection '';
		    proxy_buffering off;
		    proxy_cache off;
		    proxy_read_timeout 300s;
		}
		location /chuchuangtong/ {
		    proxy_pass http://127.0.0.1:3001;
		    proxy_set_header Host $host;
		    proxy_set_header X-Real-IP $remote_addr;
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_set_header X-Forwarded-Proto $scheme;
		    proxy_http_version 1.1;
		    proxy_set_header Connection '';
		    proxy_buffering off;
		    proxy_cache off;
		    proxy_read_timeout 300s;
		}
		location /chuchuangtong/_next/static/ {
		    alias /usr/local/nginx/html/chuchuangtong/standalone/.next/static/;
		    expires 30d;
		    add_header Cache-Control "public, immutable";
		}
			

        
        # 前端页面配置（新增）
#        root  /usr/local/nginx/html; # 前端文件根目录
	   root /usr/local/nginx/html/dist;
        index index.html; # 默认首页

        # 前端路由兼容（单页应用必备）
        location / {
            try_files $uri $uri/ /index.html; # 找不到文件时跳转首页，支持前端路由
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  fastcgi_index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }

    # HTTP自动跳转到HTTPS
	server {
	    listen 80;
	    server_name axuxtl.xyz www.axuxtl.xyz;
	    return 301 https://$host$request_uri;
	}


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}


    # HTTPS server
    #
    #server {
    #    listen       443 ssl;
    #    server_name  localhost;

    #    ssl_certificate      cert.pem;
    #    ssl_certificate_key  cert.key;

    #    ssl_session_cache    shared:SSL:1m;
    #    ssl_session_timeout  5m;

    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}

}
